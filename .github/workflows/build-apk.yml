name: Build APK

on:
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Bundle latest page as offline fallback
        run: cp docs/index.html app/src/main/assets/index.html
      - name: Bundle AI models into the app
        run: bash app/bundle-models.sh
      - name: Build APK
        run: gradle assembleDebug --stacktrace -PpagesUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: CamTrax-apk
          path: app/build/outputs/apk/debug/*.apk
